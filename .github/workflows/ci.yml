name: ContextFold Static and Unit CI
on:
  push:
  pull_request:
jobs:
  static-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install network-free test dependencies
        run: python -m pip install pytest==8.4.2
      - name: Syntax and guarded configuration
        run: python scripts/preflight.py
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Compile contract and scripts
        run: python -m compileall -q contracts scripts tests

  contract-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned contract tooling
        run: python -m pip install genvm-linter==0.11.0 pyright
      - name: GenVM lint and semantic schema validation
        env:
          GENVM_VERSION: v0.3.0-rc7
        run: genvm-lint check contracts/contextfold.py --json

  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Direct Mode suite
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-test.txt
      - name: Prepare pinned GenVM Direct Mode runners
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/gltest-direct"
          mkdir -p "$cache_dir"
          archive="$cache_dir/genvm-universal-v0.3.0-rc7.tar.xz"
          curl --fail --location --retry 3 \
            https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
            --output "$archive"
          echo 'e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  '"$archive" | sha256sum --check --status
      - name: Run real Direct Mode behavior suite
        run: python -m pytest tests/direct -q
